name: Build Zernio test images

on:
  push:
    branches: [codex/zernio-instagram-connect]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build app image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: app
          push: true
          tags: ghcr.io/${{ github.repository }}:zernio-test-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build migration image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: migrate
          push: true
          tags: ghcr.io/${{ github.repository }}-migrate:zernio-test-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build publish worker image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: worker
          push: true
          tags: ghcr.io/${{ github.repository }}-worker:zernio-test-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
